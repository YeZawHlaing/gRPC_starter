syntax="proto3";
package user.v1;

option java_multiple_files = true;
option java_package = "com.example.grpc";

message getUserRequest{
  string user_id=1;
}

message userResponse{
  string user_id=1;
  string name=2;
}

service UserService{
  rpc GetUser(getUserRequest)
      returns (userResponse);
}